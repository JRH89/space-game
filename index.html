<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Shooter</title>
    <link rel="stylesheet" href="./src/style.css">
</head>

<body>
    <div id="intro-container">
        <video id="intro-video" playsinline muted>
            <source src="./src/assets/videos/intro.mp4" type="video/mp4">
        </video>
    </div>

    <div id="main-menu" style="display: none;">
        <h1>SPACE SHOOTER</h1>
        <button id="start-btn">START</button>
        <button id="about-btn">ABOUT</button>
        <button id="credits-btn">CREDITS</button>
        <button id="exit-btn">EXIT</button>
    </div>

    <div id="about-screen" class="menu-screen" style="display: none;">
        <h1>ABOUT</h1>
        <p>A space shooter game built with Three.js.</p>
        <p>Tech Stack: Three.js, Vanilla JS, CSS.</p>
        <button class="back-btn">BACK</button>
    </div>

    <div id="credits-screen" class="menu-screen" style="display: none;">
        <h1>CREDITS</h1>
        <p>Spaceship Model: Free3D</p>
        <p>Textures: Solar System Scope</p>
        <button class="back-btn">BACK</button>
    </div>

    <div id="ui-container" style="display: none;">
        <div id="score">Score: 0</div>
        <div id="level">Level: 1</div>
        <div id="lives-container">
            <div id="lives"></div>
        </div>
        <div id="health-bar-container">
            <div id="health-bar"></div>
        </div>
        <div id="powerups-container"></div>

        <div id="game-over" style="display: none;">
            <div class="inner">
                <h1>GAME OVER</h1>
                <button id="restart-btn">Restart</button>
            </div>
        </div>

        <div id="pause-menu" style="display: none;">
            <div class="inner">
                <h1>PAUSED</h1>
                <button id="resume-btn">Resume</button>
            </div>
        </div>

        <div id="ad-container">
            <script async
                src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9106810782791939"
                crossorigin="anonymous"></script>
            <!-- space-game -->
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-9106810782791939"
                data-ad-slot="2132843939" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>
                (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
</body>

</html>
